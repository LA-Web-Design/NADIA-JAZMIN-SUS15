<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Fiesta en Vivo</title>
    <style>
        /* Fondo general de la pantalla (Violeta oscuro texturado) */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0f24;
            background-image: radial-gradient(circle, #2a163b 0%, #11081a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Panel Central (Morado) */
        .panel {
            background: linear-gradient(135deg, #3d2256 0%, #29153d 100%);
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #d8c2ef;
            text-align: center;
        }

        /* Botones Neumórficos Cian */
        .btn-cyan {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(145deg, #00d2ff, #007bb5);
            color: #0b1a26;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-cyan:active {
            transform: scale(0.98);
        }

        /* Caja de texto "calada" (Efecto cóncavo) */
        .input-container {
            width: 100%;
            background: #1c0e29;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -4px -4px 8px rgba(255, 255, 255, 0.03);
            box-sizing: border-box;
        }

        .input-container textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            resize: none;
            outline: none;
            height: 70px;
            font-family: inherit;
        }

        .input-container textarea::placeholder {
            color: #8c73a8;
        }

        .char-counter {
            text-align: right;
            font-size: 11px;
            color: #8c73a8;
            margin-top: 5px;
        }

        /* Mensaje de éxito y contador */
        .success-message {
            font-size: 13px;
            color: #ffffff;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .success-message span.success-tag {
            color: #2ecc71;
            font-weight: bold;
        }

        .success-message span.count {
            color: #2ecc71;
            font-weight: bold;
        }

        /* Botón Subir Más (Placeholder de color a definir) */
        .btn-subir-mas {
            background: #4a3b5c;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="panel-title">SUBIR CONTENIDO</div>

        <!-- Botón 1: Seleccionar de galería -->
        <button class="btn-cyan" onclick="document.getElementById('fileInput').click();">
            📂 SELECCIONAR DE GALERÍA
        </button>
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display: none;">

        <!-- Botón 2: Tomar foto o video -->
        <button class="btn-cyan" onclick="document.getElementById('cameraInput').click();">
            📸 TOMAR FOTO O VIDEO
        </button>
        <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" style="display: none;">

        <!-- Caja de texto calada para el saludo -->
        <div class="input-container">
            <textarea id="saludoText" maxlength="200" placeholder="Escribe tu saludo (máx. 200 caracteres)" oninput="actualizarContador(this)"></textarea>
            <div class="char-counter" id="counter">0/200</div>
        </div>

        <!-- Botón 3: Enviar -->
        <button class="btn-cyan">
            🚀 ENVIAR
        </button>

        <!-- Mensaje de Estado / Éxito dinámico -->
        <div class="success-message">
            <span class="success-tag">¡ÉXITO!</span> Se subieron <span class="count">3</span> imágenes y <span class="count">1</span> texto.
        </div>

        <!-- Botón Subir Más -->
        <button class="btn-subir-mas">
            + SUBIR MÁS
        </button>
    </div>

    <script>
        // Función simple para actualizar el contador de caracteres del saludo
        function actualizarContador(textarea) {
            const actual = textarea.value.length;
            document.getElementById('counter').textContent = actual + '/200';
        }
    </script>
</body>
</html>
