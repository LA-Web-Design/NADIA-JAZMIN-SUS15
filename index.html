<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida de Fotos - Evento</title>
    <style>
        :root {
            --primary-color: #28a745;
            --primary-hover: #218838;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Estilo general de los botones */
        .btn-action {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.2s, opacity 0.2s;
            margin-bottom: 15px;
            text-decoration: none;
        }

        /* Botones de selección (cámara y galería) */
        .btn-select {
            background-color: transparent;
            color: var(--text-color);
            border: 2px dashed var(--border-color);
        }

        .btn-select:hover {
            border-color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Botón de envío principal */
        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            display: none;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #444;
            color: #999;
            cursor: not-allowed;
        }

        /* Contador de archivos acumulados */
        #counter-badge {
            font-size: 0.95rem;
            color: #ffc107;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 1.2em;
        }

        /* Ocultar inputs reales de archivos */
        input[type="file"] {
            display: none;
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Subí tus fotos</h2>
    <p class="subtitle">Tomá fotos con la cámara o elegilas de tu galería. ¡Podés sumar de ambos lados antes de enviar!</p>

    <!-- Botón 1: Tomar Fotos con la Cámara -->
    <label for="cameraInput" class="btn-action btn-select" id="camLabel">
        📸 Tomar Fotos
    </label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple>

    <!-- Botón 2: Imágenes de la Galería -->
    <label for="galleryInput" class="btn-action btn-select" id="galLabel">
        🖼️ Imágenes de la Galería
    </label>
    <input type="file" id="galleryInput" accept="image/*" multiple>

    <!-- Contador de selección -->
    <div id="counter-badge"></div>

    <!-- Botón 3: Enviar conjunto -->
    <button id="submitBtn" class="btn-action btn-submit" onclick="enviarFotos()">
        Enviar al Evento
    </button>

    <div id="status-msg"></div>
</div>

<script>
    // URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxz6aPNA3RMYnxP38dg4tSTXJViQtC2C_cBn7kcn5tu3ro1LFffwyAJP67varPvQLs5/exec";

    let archivosAcumulados = [];

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const submitBtn = document.getElementById('submitBtn');
    const counterBadge = document.getElementById('counter-badge');
    const statusMsg = document.getElementById('status-msg');

    // Evento al tomar fotos con la cámara (acumula)
    cameraInput.addEventListener('change', (e) => {
        agregarArchivos(e.target.files);
        cameraInput.value = ''; // Resetear para permitir capturar de nuevo
    });

    // Evento al seleccionar de la galería (acumula)
    galleryInput.addEventListener('change', (e) => {
        agregarArchivos(e.target.files);
        galleryInput.value = ''; // Resetear para permitir seleccionar más
    });

    function agregarArchivos(nuevosFiles) {
        const list = Array.from(nuevosFiles);
        list.forEach(file => {
            if (file.size > 15 * 1024 * 1024) {
                alert(`La foto "${file.name}" supera los 15 MB y fue descartada.`);
                return;
            }
            archivosAcumulados.push(file);
        });
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const total = archivosAcumulados.length;
        if (total > 0) {
            counterBadge.innerText = `📂 Total acumulado: ${total} foto(s) lista(s)`;
            submitBtn.style.display = "block";
            statusMsg.innerText = "";
        } else {
            counterBadge.innerText = "";
            submitBtn.style.display = "none";
            statusMsg.innerText = "";
        }
    }

    // Función principal de envío con compresión previa
    async function enviarFotos() {
        if (archivosAcumulados.length === 0) return;

        // Deshabilitar controles durante el envío
        submitBtn.disabled = true;
        cameraInput.disabled = true;
        galleryInput.disabled = true;
        
        let correctas = 0;
        let rechazadas = 0;

        for (let i = 0; i < archivosAcumulados.length; i++) {
            const file = archivosAcumulados[i];
            statusMsg.style.color = "#ffc107";
            statusMsg.innerText = `Procesando y analizando ${i + 1} de ${archivosAcumulados.length}...`;

            try {
                // Comprimir imagen antes de mandar para evitar saturar Cloud Vision
                const base64Comprimido = await comprimirImagen(file);

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        file: base64Comprimido,
                        name: file.name,
                        mimeType: "image/jpeg"
                    })
                });

                const resultado = await response.json();

                if (resultado.status === "success") {
                    correctas++;
                } else {
                    rechazadas++;
                    console.warn(`Foto rechazada (${file.name}):`, resultado.message);
                }
            } catch (err) {
                rechazadas++;
                console.error("Error de red al enviar foto:", err);
            }
        }

        // Mostrar resumen final
        statusMsg.style.color = correctas > 0 ? "#28a745" : "#dc3545";
        statusMsg.innerText = `¡Proceso finalizado! Subidas: ${correctas} | Rechazadas por seguridad: ${rechazadas}`;

        // Limpiar lista y restablecer interfaz para seguir subiendo más si se desea
        archivosAcumulados = [];
        submitBtn.disabled = false;
        cameraInput.disabled = false;
        galleryInput.disabled = false;
        actualizarInterfaz();
    }

    // Función para comprimir la imagen en el navegador a un ancho máx de 1000px (Súper liviana para la IA)
    function comprimirImagen(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convertir a JPEG comprimido al 82% de calidad
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    resolve(dataUrl);
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }
</script>

</body>
</html>
