<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida de Fotos - Evento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 1. FONDO AZUL CELESTE CON TEXTURA MÁS VISIBLE */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #62ebd9 !important; 
            background-image: 
                radial-gradient(circle at center, rgba(255,255,255,0.4) 0%, rgba(20,60,110,0.2) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E") !important;
        }

        /* 2. PANEL VIOLETA OSCURO CON TEXTURA DE CUERO */
        .card {
            width: 100% !important;
            max-width: 360px !important;
            padding: 30px 22px !important;
            border-radius: 24px !important;
            background-color: #21132b !important;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.3'/%3E%3C/svg%3E") !important;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                inset 0 -2px 4px rgba(0, 0, 0, 0.8) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: none !important;
        }

        h2 {
            color: #ffffff !important;
            font-size: 1.3rem !important;
            font-weight: 800 !important;
            letter-spacing: 1.5px !important;
            text-transform: uppercase !important;
            margin-bottom: 8px !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5) !important;
        }

        p.subtitle {
            color: #b0a0c0 !important;
            font-size: 0.88rem !important;
            margin-bottom: 20px !important;
            line-height: 1.4 !important;
        }

        /* 3. BOTONES CON GRID (Icono Izquierda / Texto Centrado) */
        .btn-action {
            display: grid !important;
            grid-template-columns: 24px 1fr 24px; /* Icono / Texto / Espaciador */
            align-items: center !important;
            width: 100% !important;
            height: 52px !important;
            padding: 0 18px !important;
            font-size: 0.82rem !important;
            font-weight: 900 !important;
            letter-spacing: 0.8px !important;
            text-transform: uppercase !important;
            border-radius: 26px !important;
            border: none !important;
            cursor: pointer !important;
            box-sizing: border-box !important;
            transition: transform 0.1s ease, filter 0.1s ease !important;
            margin-bottom: 15px !important;
            text-decoration: none !important;
        }

        .btn-action span {
            text-align: center;
        }

        .btn-action svg {
            justify-self: start;
        }

        .btn-action:hover:not(:disabled) {
            filter: brightness(1.08) !important;
        }

        .btn-action:active:not(:disabled) {
            transform: translateY(2px) !important;
        }

        /* BOTONES CIAN TRIDIMENSIONALES */
        .btn-select, .btn-submit {
            background: linear-gradient(
                180deg, 
                #1c8491 0%, 
                #2ee8d6 30%, 
                #72fdf1 50%, 
                #2be0cf 70%, 
                #105963 100%
            ) !important;
            color: #0b1c20 !important;
            box-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.5),
                inset 0 2px 3px rgba(255, 255, 255, 0.8),
                inset 0 -3px 4px rgba(0, 0, 0, 0.4) !important;
        }

        .btn-submit:disabled {
            opacity: 0.6 !important;
            cursor: not-allowed !important;
            filter: grayscale(0.5) !important;
        }

        /* BOTÓN VERDE "SUBIR MÁS" */
        .btn-reset {
            background: linear-gradient(
                180deg, 
                #1a7a2e 0%, 
                #3ee062 30%, 
                #85fd9f 50%, 
                #36ca58 70%, 
                #0f521f 100%
            ) !important;
            color: #051a09 !important;
            box-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.5),
                inset 0 2px 3px rgba(255, 255, 255, 0.8),
                inset 0 -3px 4px rgba(0, 0, 0, 0.4) !important;
            display: none;
        }

        #counter-badge {
            font-size: 0.88rem !important;
            color: #fffd8d !important;
            font-weight: 700 !important;
            margin-bottom: 12px !important;
            min-height: 1.2em !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5) !important;
        }

        input[type="file"] {
            display: none !important;
        }

        #status-msg {
            margin-top: 10px !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            min-height: 1.2em !important;
            width: 100% !important;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Subí tus fotos</h2>
    <p class="subtitle">Tomá fotos con la cámara o elegilas de tu galería. ¡Podés sumar de ambos lados antes de enviar!</p>

    <div id="upload-section" style="width: 100%;">
        <label for="cameraInput" class="btn-action btn-select" id="camLabel">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Tomar Fotos</span>
            <i></i>
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple>

        <label for="galleryInput" class="btn-action btn-select" id="galLabel">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Imágenes de la Galería</span>
            <i></i>
        </label>
        <input type="file" id="galleryInput" accept="image/*" multiple>

        <div id="counter-badge"></div>

        <button id="submitBtn" class="btn-action btn-submit" onclick="enviarFotos()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            <span>Enviar al Evento</span>
            <i></i>
        </button>
    </div>

    <!-- Botón verde para subir más -->
    <button id="resetBtn" class="btn-action btn-reset" onclick="reiniciarPanel()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Subir más imágenes</span>
        <i></i>
    </button>

    <div id="status-msg"></div>
</div>

<script>
    // TU LÓGICA JAVASCRIPT EXACTA E INTACTA
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-nJQ25ybvnDQTWnhvUn8IWFREKyTtNq_JlbttDPsAzwJRA30itIIf5LMoMxHqtoI/exec";

    let archivosAcumulados = [];

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const uploadSection = document.getElementById('upload-section');
    const counterBadge = document.getElementById('counter-badge');
    const statusMsg = document.getElementById('status-msg');

    cameraInput.addEventListener('change', (e) => {
        agregarArchivos(e.target.files);
        cameraInput.value = '';
    });

    galleryInput.addEventListener('change', (e) => {
        agregarArchivos(e.target.files);
        galleryInput.value = '';
    });

    function agregarArchivos(nuevosFiles) {
        const list = Array.from(nuevosFiles);
        list.forEach(file => {
            if (file.size > 15 * 1024 * 1024) {
                alert(`La foto "${file.name}" supera los 15 MB y fue descartada.`);
                return;
            }
            archivosAcumulados.push(file);
        });
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const total = archivosAcumulados.length;
        if (total > 0) {
            counterBadge.innerText = `📂 Total acumulado: ${total} foto(s) lista(s)`;
            submitBtn.style.display = "grid";
            statusMsg.innerText = "";
        } else {
            counterBadge.innerText = "";
            submitBtn.style.display = "none";
            statusMsg.innerText = "";
        }
    }

    async function enviarFotos() {
        if (archivosAcumulados.length === 0) return;

        submitBtn.disabled = true;
        cameraInput.disabled = true;
        galleryInput.disabled = true;
        
        let correctas = 0;
        let rechazadas = 0;

        for (let i = 0; i < archivosAcumulados.length; i++) {
            const file = archivosAcumulados[i];
            statusMsg.style.color = "#fffd8d";
            statusMsg.innerText = `Procesando ${i + 1} de ${archivosAcumulados.length}...`;

            try {
                const base64Comprimido = await comprimirImagen(file);

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        file: base64Comprimido,
                        name: file.name,
                        mimeType: "image/jpeg"
                    })
                });

                const textResponse = await response.text();
                let resultado;
                try {
                    resultado = JSON.parse(textResponse);
                } catch (e) {
                    resultado = { status: "error", message: "Respuesta inválida del servidor" };
                }

                if (resultado.status === "success") {
                    correctas++;
                } else {
                    rechazadas++;
                }
            } catch (err) {
                rechazadas++;
            }
        }

        // Mostrar cartel final con éxito y habilitar botón para subir más
        statusMsg.style.color = "#85fd9f";
        statusMsg.innerHTML = `✨ ¡LISTO! Se subieron ${correctas} foto(s) correctamente.` + (rechazadas > 0 ? `<br><span style="color:#dc3545;">(${rechazadas} rechazadas)</span>` : '');

        // Ocultar botones de selección y mostrar el botón de "Subir más imágenes"
        uploadSection.style.display = "none";
        resetBtn.style.display = "grid";
    }

    function reiniciarPanel() {
        archivosAcumulados = [];
        statusMsg.innerText = "";
        counterBadge.innerText = "";
        submitBtn.style.display = "none";
        submitBtn.disabled = false;
        cameraInput.disabled = false;
        galleryInput.disabled = false;
        resetBtn.style.display = "none";
        uploadSection.style.display = "block";
    }

    function comprimirImagen(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    resolve(dataUrl);
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }
</script>

</body>
</html>
