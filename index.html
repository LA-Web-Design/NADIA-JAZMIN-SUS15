<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subí tus fotos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.2s, opacity 0.2s;
            margin-bottom: 15px;
            text-decoration: none;
        }

        /* Botón estilo input file (Selector / Cámara) */
        .btn-select {
            background-color: transparent;
            color: #ffffff;
            border: 2px dashed #6c757d;
        }

        .btn-select:hover {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Botón verde principal de enviar */
        .btn-submit {
            background-color: #28a745;
            color: #ffffff;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #218838;
        }

        .btn-submit:disabled {
            background-color: #444444;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.7;
        }

        input[type="file"] {
            display: none;
        }

        #status-msg {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Subí tus fotos</h2>
    <p>Podés elegir varias fotos o tomarlas con la cámara (máx. 10 MB por foto).</p>

    <!-- Label que actúa como botón para abrir galería o cámara -->
    <label for="fileInput" class="btn-action btn-select" id="selectLabel">
        📷 Seleccionar o sacar fotos
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <!-- Botón de envío -->
    <button id="submitBtn" class="btn-action btn-submit" onclick="enviarFotos()" disabled>
        Subir más imágenes
    </button>

    <div id="status-msg"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxz6aPNA3RMYnxP38dg4tSTXJViQtC2C_cBn7kcn5tu3ro1LFffwyAJP67varPvQLs5/exec";

    let archivosSeleccionados = [];
    const fileInput = document.getElementById('fileInput');
    const selectLabel = document.getElementById('selectLabel');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('status-msg');

    fileInput.addEventListener('change', (e) => {
        const nuevos = Array.from(e.target.files);
        
        nuevos.forEach(file => {
            if (file.size > 10 * 1024 * 1024) {
                alert(`La foto "${file.name}" supera los 10 MB y fue descartada.`);
                return;
            }
            archivosSeleccionados.push(file);
        });

        actualizarInterfaz();
    });

    function actualizarInterfaz() {
        if (archivosSeleccionados.length > 0) {
            selectLabel.innerText = `📷 ${archivosSeleccionados.length} foto(s) seleccionada(s)`;
            submitBtn.disabled = false;
            statusMsg.innerText = "";
        } else {
            selectLabel.innerText = "📷 Seleccionar o sacar fotos";
            submitBtn.disabled = true;
        }
    }

    async function enviarFotos() {
        if (archivosSeleccionados.length === 0) return;

        submitBtn.disabled = true;
        selectLabel.style.pointerEvents = "none";
        statusMsg.style.color = "#ffc107";
        statusMsg.innerText = "Subiendo fotos, por favor esperá...";

        let correctas = 0;

        for (let i = 0; i < archivosSeleccionados.length; i++) {
            const file = archivosSeleccionados[i];
            statusMsg.innerText = `Subiendo ${i + 1} de ${archivosSeleccionados.length}...`;

            try {
                const base64Data = await convertirBase64(file);
                
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        file: base64Data,
                        name: file.name,
                        mimeType: file.type
                    })
                });

                correctas++;
            } catch (err) {
                console.error("Error al enviar:", err);
            }
        }

        statusMsg.style.color = "#28a745";
        statusMsg.innerText = `¡Éxito! Se subieron ${correctas} foto(s) correctamente.`;
        
        // Limpiar estado
        archivosSeleccionados = [];
        fileInput.value = '';
        
        setTimeout(() => {
            selectLabel.innerText = "📷 Seleccionar o sacar fotos";
            selectLabel.style.pointerEvents = "auto";
            submitBtn.disabled = true;
            statusMsg.innerText = "";
        }, 5000);
    }

    function convertirBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
</script>

</body>
</html>
