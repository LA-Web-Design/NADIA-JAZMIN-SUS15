<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Foto del Evento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 20px; color: #333; }
    .btn { display: inline-block; width: 100%; padding: 12px; margin: 10px 0; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn:hover { background-color: #0056b3; }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .loading { color: #ffc107; }
  </style>
</head>
<body>

  <div class="card">
    <h2>¡Compartí tu foto del evento!</h2>
    
    <!-- Botón para seleccionar o tomar foto -->
    <label class="btn" for="photoInput">Elegir Foto o Tomar Foto</label>
    <input type="file" id="photoInput" accept="image/*">

    <div id="status"></div>
  </div>

  <script>
    // URL DE TU WEB APP DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = "PEGAR_AQUI_TU_URL_DE_APPS_SCRIPT"; 

    const MAX_SIZE_MB = 10;
    const photoInput = document.getElementById("photoInput");
    const statusDiv = document.getElementById("status");

    photoInput.addEventListener("change", function() {
      const file = this.files[0];
      if (!file) return;

      // Validar tamaño máximo (10 MB)
      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        statusDiv.className = "error";
        statusDiv.innerText = `El archivo supera el límite de ${MAX_SIZE_MB} MB.`;
        this.value = "";
        return;
      }

      statusDiv.className = "loading";
      statusDiv.innerText = "Analizando y subiendo imagen...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            file: base64Data,
            name: file.name,
            mimeType: file.type
          })
        })
        .then(() => {
          statusDiv.className = "success";
          statusDiv.innerText = "¡Foto procesada correctamente!";
          photoInput.value = "";
        })
        .catch(err => {
          statusDiv.className = "error";
          statusDiv.innerText = "Ocurrió un error al enviar la imagen.";
          console.error(err);
        });
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
