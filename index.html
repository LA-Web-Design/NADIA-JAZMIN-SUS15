<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida de Fotos - Evento</title>
    <style>
        :root {
            --primary-color: #28a745; /* Verde principal */
            --primary-hover: #218838;
            --bg-color: #121212;     /* Fondo oscuro */
            --card-bg: #1e1e1e;      /* Fondo de la tarjeta */
            --text-color: #ffffff;   /* Texto claro */
            --border-color: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Estilo de los botones principales */
        .btn-action {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.2s, opacity 0.2s;
            margin-bottom: 15px;
            text-decoration: none;
        }

        /* Botón de selección/cámara (Dashed) */
        .btn-select {
            background-color: transparent;
            color: var(--text-color);
            border: 2px dashed var(--border-color);
        }

        .btn-select:hover {
            border-color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Botón principal de enviar (Verde) */
        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            display: none; /* Oculto por defecto */
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #444;
            color: #999;
            cursor: not-allowed;
        }

        /* Botón secundario para subir más fotos después de finalizar */
        .btn-more {
            background-color: var(--primary-color);
            color: #ffffff;
            display: none; /* Oculto hasta que finaliza la subida */
        }

        .btn-more:hover {
            background-color: var(--primary-hover);
        }

        /* Ocultar el input file real */
        input[type="file"] {
            display: none;
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 1.2em; /* Para que no salte la interfaz al aparecer */
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Subí tus fotos</h2>
    <p class="subtitle">Podés elegir varias fotos o tomarlas con la cámara (máx. 10 MB por foto).</p>

    <!-- Botón 1: Selector / Cámara (Abre galería o cámara en móviles) -->
    <label for="fileInput" class="btn-action btn-select" id="selectLabel">
        📷 Seleccionar o sacar fotos
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <!-- Botón 2: Enviar fotos seleccionadas -->
    <button id="submitBtn" class="btn-action btn-submit" onclick="enviarFotos()">
        Enviar al Evento
    </button>

    <!-- Botón 3: Subir más imágenes (aparece al terminar) -->
    <label for="fileInput" class="btn-action btn-more" id="moreBtn">
        + Subir más imágenes
    </label>

    <div id="status-msg"></div>
</div>

<script>
    // PEGA ACÁ TU URL DE LA APP WEB DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxz6aPNA3RMYnxP38dg4tSTXJViQtC2C_cBn7kcn5tu3ro1LFffwyAJP67varPvQLs5/exec";

    let archivosSeleccionados = [];
    const fileInput = document.getElementById('fileInput');
    const selectLabel = document.getElementById('selectLabel');
    const submitBtn = document.getElementById('submitBtn');
    const moreBtn = document.getElementById('moreBtn');
    const statusMsg = document.getElementById('status-msg');

    // Al seleccionar archivos
    fileInput.addEventListener('change', (e) => {
        const nuevos = Array.from(e.target.files);
        
        nuevos.forEach(file => {
            if (file.size > 10 * 1024 * 1024) {
                alert(`La foto "${file.name}" supera los 10 MB y fue descartada.`);
                return;
            }
            archivosSeleccionados.push(file);
        });

        actualizarInterfaz();
    });

    // Actualiza la interfaz según si hay archivos seleccionados
    function actualizarInterfaz() {
        if (archivosSeleccionados.length > 0) {
            // Cambiar texto del primer botón y mostrar botón de envío
            selectLabel.innerText = `📁 ${archivosSeleccionados.length} foto(s) seleccionada(s)`;
            submitBtn.style.display = "block";
            moreBtn.style.display = "none";
            statusMsg.innerText = "";
            statusMsg.style.color = "#a0a0a0";
        } else {
            // Volver al estado inicial
            selectLabel.innerText = "📷 Seleccionar o sacar fotos";
            submitBtn.style.display = "none";
            statusMsg.innerText = "";
        }
    }

    // Lógica de envío
    async function enviarFotos() {
        if (archivosSeleccionados.length === 0) return;

        // Deshabilitar botones y mostrar mensaje de carga
        submitBtn.disabled = true;
        submitBtn.innerText = "Enviando...";
        selectLabel.style.pointerEvents = "none";
        statusMsg.style.color = "#ffc107"; // Amarillo ámbar
        statusMsg.innerText = "Subiendo fotos, por favor esperá...";

        let correctas = 0;

        for (let i = 0; i < archivosSeleccionados.length; i++) {
            const file = archivosSeleccionados[i];
            statusMsg.innerText = `Subiendo ${i + 1} de ${archivosSeleccionados.length}...`;

            try {
                const base64Data = await convertirBase64(file);
                
                // Enviar al script
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        file: base64Data,
                        name: file.name,
                        mimeType: file.type
                    })
                });

                correctas++;
            } catch (err) {
                console.error("Error al enviar:", err);
            }
        }

        // Finalizar subida
        statusMsg.style.color = "#28a745"; // Verde éxito
        statusMsg.innerText = `¡Éxito! Se subieron ${correctas} foto(s) correctamente.`;
        
        // Limpiar selección para el próximo lote
        archivosSeleccionados = [];
        fileInput.value = '';

        // Ocultar selectores y mostrar el botón de "+ Subir más imágenes"
        selectLabel.style.display = "none";
        submitBtn.style.display = "none";
        moreBtn.style.display = "block";
        
        // Restaurar botón de envío para la próxima vez
        submitBtn.disabled = false;
        submitBtn.innerText = "Enviar al Evento";
        selectLabel.style.pointerEvents = "auto";
    }

    function convertirBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
</script>

</body>
</html>
