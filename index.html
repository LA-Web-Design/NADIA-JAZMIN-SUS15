<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Foto del Evento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 20px; color: #333; }
    .btn { display: block; width: 100%; padding: 14px; margin: 12px 0; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; }
    .btn-camera { background-color: #28a745; }
    .btn:hover { opacity: 0.9; }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .loading { color: #ffc107; }
  </style>
</head>
<body>

  <div class="card">
    <h2>¡Compartí tu foto del evento!</h2>
    
    <!-- Botón 1: Elegir de la Galería -->
    <label class="btn" for="galleryInput">🖼️ Elegir de la Galería</label>
    <input type="file" id="galleryInput" accept="image/*">

    <!-- Botón 2: Abrir Cámara Directamente -->
    <label class="btn btn-camera" for="cameraInput">📸 Tomar Foto</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <div id="status"></div>
  </div>

  <script>
    // URL DE TU WEB APP DE GOOGLE APPS SCRIPT (VERSIÓN 5)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz6aPNA3RMYnxP38dg4tSTXJViQtC2C_cBn7kcn5tu3ro1LFffwyAJP67varPvQLs5/exec"; 

    const MAX_SIZE_MB = 10;
    const galleryInput = document.getElementById("galleryInput");
    const cameraInput = document.getElementById("cameraInput");
    const statusDiv = document.getElementById("status");

    function procesarArchivo(file, inputElement) {
      if (!file) return;

      // Validar tamaño máximo (10 MB)
      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        statusDiv.className = "error";
        statusDiv.innerText = `El archivo supera el límite de ${MAX_SIZE_MB} MB.`;
        inputElement.value = "";
        return;
      }

      statusDiv.className = "loading";
      statusDiv.innerText = "Analizando y subiendo imagen...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            file: base64Data,
            name: file.name || "foto_evento.jpg",
            mimeType: file.type
          })
        })
        .then(() => {
          statusDiv.className = "success";
          statusDiv.innerText = "¡Foto procesada correctamente!";
          inputElement.value = "";
        })
        .catch(err => {
          statusDiv.className = "error";
          statusDiv.innerText = "Ocurrió un error al enviar la imagen.";
          console.error(err);
        });
      };

      reader.readAsDataURL(file);
    }

    galleryInput.addEventListener("change", function() {
      procesarArchivo(this.files[0], this);
    });

    cameraInput.addEventListener("change", function() {
      procesarArchivo(this.files[0], this);
    });
  </script>

</body>
</html>
